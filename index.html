<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Text Field</title>
  
    <style>
        @font-face {
            font-family: "NotoColorEmoji";
            src: url("noto-color-emoji.ttf") format("truetype");
        }

      

        body {
            font-family: "NotoColorEmoji", sans-serif;
        }

        input[type="text"], textarea {
            font-family: "NotoColorEmoji", sans-serif;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <h1>Noto Color Emoji text field</h1>
    <input type="text" placeholder="Type emojis here">
    <br><br>
    <textarea rows="4" cols="40" placeholder="Or here…"></textarea>
</body>
</html>
